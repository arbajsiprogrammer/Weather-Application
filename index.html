    <div class="main-container">
      <!-- Input  container-->
      <div class="input-container" id="input-container">
        <input type="text" class="city-input" id="city-input" placeholder="search city " />
        <button class="search-btn" id="search-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-search"
            viewBox="0 0 16 16"
          >
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
            />
          </svg>
        </button>
      </div>
      <!-- weather info -->
      <div class="weather-info" id="weather-info">
        <div class="location-date-container">
          <div class="location">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              class="bi bi-geo-alt-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"
              />
            </svg>
            <h4 class="country-txt" id="country-txt">Jakarta</h4>
          </div>
 
          <h5 class="current-date-txt regular-text" id="current-date-txt">wed , 07 Aug</h5>
        </div>
        <div class="weather-summary-container">
          <img src="" alt="cloud img" class="weather-summary-img" id="weather-summary-img" />
          <div class="weather-summary-info">
            <h1 class="temp-txt" id="temp-txt">29 ℃</h1>
            <h3 class="condition-txt regular-text" id="condition-txt">Clouds</h3>
          </div>
        </div>

        <div class="weather-conditions-container">
          <div class="condition-item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              fill="currentColor"
              class="bi bi-droplet"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M7.21.8C7.69.295 8 0 8 0q.164.544.371 1.038c.812 1.946 2.073 3.35 3.197 4.6C12.878 7.096 14 8.345 14 10a6 6 0 0 1-12 0C2 6.668 5.58 2.517 7.21.8m.413 1.021A31 31 0 0 0 5.794 3.99c-.726.95-1.436 2.008-1.96 3.07C3.304 8.133 3 9.138 3 10a5 5 0 0 0 10 0c0-1.201-.796-2.157-2.181-3.7l-.03-.032C9.75 5.11 8.5 3.72 7.623 1.82z"
              />
              <path
                fill-rule="evenodd"
                d="M4.553 7.776c.82-1.641 1.717-2.753 2.093-3.13l.708.708c-.29.29-1.128 1.311-1.907 2.87z"
              />
            </svg>
            <div class="condition-info">
              <h5 class="regular-txt">Humidity</h5>
              <h5 class="humidity-value-txt" id="humidity-value-txt">55%</h5>
            </div>
          </div>

          <!-- 2nd -->
          <div class="condition-item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              fill="currentColor"
              class="bi bi-wind"
              viewBox="0 0 16 16"
            >
              <path
                d="M12.5 2A2.5 2.5 0 0 0 10 4.5a.5.5 0 0 1-1 0A3.5 3.5 0 1 1 12.5 8H.5a.5.5 0 0 1 0-1h12a2.5 2.5 0 0 0 0-5m-7 1a1 1 0 0 0-1 1 .5.5 0 0 1-1 0 2 2 0 1 1 2 2h-5a.5.5 0 0 1 0-1h5a1 1 0 0 0 0-2M0 9.5A.5.5 0 0 1 .5 9h10.042a3 3 0 1 1-3 3 .5.5 0 0 1 1 0 2 2 0 1 0 2-2H.5a.5.5 0 0 1-.5-.5"
              />
            </svg>
            <div class="condition-info">
              <h5 class="regular-txt">Wind Speed</h5>
              <h5 class="wind-value-txt" id="wind-value-txt">2 M/s</h5>
            </div>
          </div>
        </div>

      <!-- Search city Home page  -->
      <div class="search-city" id="search-city">
        <img
          src="./Images/message/search-image-man-with-laptop.png"
          alt=""
          class="message-img "
          
        />
        <!-- <div class="message-img-div"></div> -->
        <div class="search-city-message">
          <h1>Search City</h1>
          <h4 class="regular-text">

        </div>
      </div>

      <!-- Not Found page  -->
      <div class="not-found" id="not-found">
        <img

          class="message-img"
        />
